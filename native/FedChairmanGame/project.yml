name: FedChairmanGameNative
options:
  bundleIdPrefix: local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
targets:
  FedChairmanCore:
    type: framework
    platform: macOS
    sources:
      - Sources/FedChairmanCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.fed-chairman-game.core
      GENERATE_INFOPLIST_FILE: YES

  FedChairmanGameNative:
    type: application
    platform: macOS
    sources:
      - Sources/FedChairmanNativeApp
      - Assets.xcassets
    dependencies:
      - target: FedChairmanCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.fed-chairman-game.native
      INFOPLIST_FILE: App/Info.plist
      PRODUCT_NAME: Fed Chairman Game Native
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: Config/FedChairmanGameNative.entitlements
      ENABLE_HARDENED_RUNTIME: YES

  FedChairmanCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/FedChairmanCoreTests
    dependencies:
      - target: FedChairmanCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.fed-chairman-game.core-tests
      GENERATE_INFOPLIST_FILE: YES

  FedChairmanGameNativeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/FedChairmanNativeUITests
    dependencies:
      - target: FedChairmanGameNative
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.fed-chairman-game.native-ui-tests
      TEST_TARGET_NAME: FedChairmanGameNative
      GENERATE_INFOPLIST_FILE: YES

schemes:
  FedChairmanGameNative:
    build:
      targets:
        FedChairmanGameNative: all
        FedChairmanCoreTests: [test]
        FedChairmanGameNativeUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - FedChairmanCoreTests
        - FedChairmanGameNativeUITests
