included:
  - Package.swift
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm

line_length:
  warning: 380
  error: 420
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

file_length:
  warning: 1200
  error: 1350

function_body_length:
  warning: 130
  error: 180

type_body_length:
  warning: 760
  error: 920

disabled_rules:
  - force_try
  - identifier_name
  - large_tuple
  - opening_brace
  - trailing_comma
