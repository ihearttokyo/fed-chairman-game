name: Verify Native macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    name: Native app checks
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install native tooling
        run: brew install xcodegen swiftformat swiftlint

      - name: Generate Xcode project
        working-directory: native/FedChairmanGame
        run: xcodegen generate

      - name: Swift build
        working-directory: native/FedChairmanGame
        run: swift build

      - name: SwiftFormat lint
        working-directory: native/FedChairmanGame
        run: swiftformat Sources Tests --swift-version 6.1 --lint

      - name: SwiftLint
        working-directory: native/FedChairmanGame
        run: swiftlint lint --strict

      - name: Swift tests
        working-directory: native/FedChairmanGame
        run: swift test

      - name: Native UI tests
        working-directory: native/FedChairmanGame
        run: xcodebuild test -project FedChairmanGameNative.xcodeproj -scheme FedChairmanGameNative -destination 'platform=macOS'

      - name: Local release candidate
        working-directory: native/FedChairmanGame
        run: scripts/package-native-release-candidate.sh
